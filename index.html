<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://docs.google.com">
  <title>built.at | Modern websites. Fewer monthly fees. More control.</title>
  <style>
    :root {
      --text: #111827;
      --muted: #657083;
      --border: #e5e7eb;
      --soft: #f8fafc;
      --paper: #ffffff;
      --ink: #111827;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-soft: #eff6ff;
      --max: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.62;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 760;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 15px;
      color: var(--muted);
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 18px;
      border-radius: 999px;
      background: var(--text);
      color: white;
      border: 1px solid var(--text);
      font-weight: 650;
      font-size: 15px;
      line-height: 1.2;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.secondary {
      background: white;
      color: var(--text);
      border-color: var(--border);
    }

    .hero {
      padding: 86px 0 70px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      background: var(--soft);
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      font-size: clamp(42px, 7.4vw, 80px);
      line-height: 1.02;
      letter-spacing: 0;
      margin: 0 auto 24px;
      max-width: 940px;
      font-weight: 780;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto 34px;
      font-size: clamp(18px, 2vw, 21px);
      color: var(--muted);
      line-height: 1.58;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .section {
      padding: 72px 0;
      border-top: 1px solid var(--border);
    }

    .section-header {
      max-width: 700px;
      margin-bottom: 36px;
    }

    h2 {
      font-size: clamp(31px, 4.8vw, 51px);
      line-height: 1.08;
      letter-spacing: 0;
      margin: 0 0 16px;
      font-weight: 760;
    }

    .section-header p,
    .split > div > p {
      color: var(--muted);
      font-size: 19px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px;
      background: #fff;
    }

    .card h3,
    .panel h3 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }

    .panel {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 34px;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .list div {
      padding: 15px 17px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }

    .pricing {
      background: #111827;
      color: white;
      border-radius: 8px;
      padding: 48px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: center;
    }

    .pricing p {
      color: #d1d5db;
      font-size: 19px;
      margin: 0;
    }

    .price-box {
      background: white;
      color: var(--text);
      border-radius: 8px;
      padding: 30px;
    }

    .price-box strong {
      display: block;
      font-size: 38px;
      line-height: 1.12;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .price-box span {
      color: var(--muted);
    }

    .cta {
      text-align: center;
      padding: 88px 0;
      border-top: 1px solid var(--border);
    }

    .cta h2 {
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta p {
      max-width: 640px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 20px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .status {
      max-width: 760px;
      margin: 12vh auto;
      padding: 0 24px;
      line-height: 1.55;
    }

    .status h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
    }

    .status p {
      color: var(--muted);
      font-size: 18px;
      margin: 0 0 18px;
    }

    .status code,
    .status pre {
      background: #eef2f7;
      border-radius: 6px;
    }

    .status code {
      padding: 2px 6px;
    }

    .status pre {
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      color: #111827;
      border: 1px solid var(--border);
    }

    .preview-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 20px 80px;
      font-size: 16px;
      line-height: 1.72;
    }

    .preview-content h1,
    .preview-content h2,
    .preview-content h3,
    .preview-content h4 {
      margin: 36px 0 18px;
      font-weight: 680;
      letter-spacing: 0;
    }

    .preview-content h1 {
      font-size: 34px;
      font-weight: 760;
      line-height: 1.18;
    }

    .preview-content h2 {
      font-size: 25px;
      line-height: 1.26;
    }

    .preview-content h3 {
      font-size: 20px;
      line-height: 1.3;
    }

    .preview-content h4 {
      font-size: 18px;
      line-height: 1.35;
    }

    .preview-content > :first-child {
      margin-top: 0;
    }

    .preview-content p,
    .preview-content li {
      font-size: 17px;
      margin: 0 0 16px;
    }

    .preview-content ul,
    .preview-content ol {
      margin: 0 0 20px;
      padding-left: 1.5rem;
    }

    .preview-content a {
      color: var(--link-color, #111827);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.25em;
    }

    .preview-content blockquote {
      margin: 24px 0;
      padding: 0 0 0 16px;
      border-left: 3px solid var(--border);
      color: #4b5563;
    }

    .preview-content code:not(pre code) {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
      background: var(--soft);
      color: #111827;
      border-radius: 5px;
      padding: 0.2em 0.4em;
    }

    .preview-content pre {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin: 1.5rem 0;
      overflow-x: auto;
    }

    .preview-content pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
      font-size: 0.9em;
      line-height: 1.6;
    }

    .preview-content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 20px 0;
      border-radius: 8px;
    }

    .preview-content hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 36px 0;
    }

    .preview-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 15px;
    }

    .preview-content th,
    .preview-content td {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    .preview-content th {
      background: var(--soft);
      font-weight: 650;
    }

    .claim-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 42px 24px;
    }

    .claim-content {
      width: min(100%, 760px);
    }

    .claim-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      font-size: 22px;
      font-weight: 760;
    }

    .claim-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
    }

    .claim-content h1 {
      max-width: 720px;
      margin: 0 0 14px;
      font-size: clamp(38px, 7vw, 66px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .claim-content p {
      max-width: 650px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 19px;
    }

    .claim-form {
      display: grid;
      gap: 18px;
      margin-top: 34px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
    }

    .claim-form label {
      display: grid;
      gap: 8px;
      font-weight: 680;
    }

    .claim-form label span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .claim-username-field {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .claim-prefix {
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      color: var(--muted);
      background: var(--soft);
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    .claim-form input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .claim-username-field input {
      min-height: 52px;
      border: 0;
      border-radius: 0;
    }

    .claim-form input:focus,
    .claim-username-field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px #dbeafe;
    }

    .claim-availability {
      min-height: 22px;
      font-size: 14px;
      color: var(--muted);
    }

    .claim-availability.ok,
    .claim-message.success {
      color: #166534;
    }

    .claim-availability.error,
    .claim-message.error {
      color: #b91c1c;
    }

    .claim-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .claim-form button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .claim-message {
      min-height: 28px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (max-width: 800px) {
      .nav-links {
        display: none;
      }

      .nav {
        min-height: 66px;
      }

      .hero {
        padding-top: 66px;
      }

      .grid,
      .split,
      .pricing {
        grid-template-columns: 1fr;
      }

      .pricing {
        padding: 32px;
      }

      .claim-shell {
        align-items: start;
        padding-top: 36px;
      }

      .claim-username-field {
        grid-template-columns: 1fr;
      }

      .claim-prefix {
        min-height: 42px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CONFIG = {
      masterSheetId: "1gL740Jji_spSBGuTqcoScqJOI6usz0J1vzn2s3x5hQg",
      masterSheetName: "Registry",
      masterRange: "A:F",
      userSheetName: "Sheet1",
      userRange: "A:D",
      signupUrl: "/app/claim",
      cacheMs: 30000,
      allowRawHtml: true
    };

    const app = document.getElementById("app");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function extractSheetId(input) {
      const value = String(input || "").trim();
      const sheetUrlMatch = value.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (sheetUrlMatch) return sheetUrlMatch[1];
      const gvizMatch = value.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)\/gviz\/tq/);
      if (gvizMatch) return gvizMatch[1];
      if (/^[a-zA-Z0-9-_]{20,}$/.test(value)) return value;
      return "";
    }

    function normalizeSlug(value) {
      const slug = String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/^\/+|\/+$/g, "");
      return slug || "index";
    }

    function isHeaderRow(row, expectedHeaders) {
      return expectedHeaders.every((header, index) => {
        return String(row[index] || "").trim().toLowerCase() === header;
      });
    }

    function booleanCell(value) {
      return String(value || "").trim().toLowerCase() === "true";
    }

    function getRoute() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      return {
        username: parts[0] || "",
        slug: normalizeSlug(parts.slice(1).join("/") || "index")
      };
    }

    function isAppRoute(route, slug) {
      return route.username === "app" && route.slug === slug;
    }

    async function loadGviz(sheetId, sheetName, range) {
      const cacheKey = `builtAt:gViz:${sheetId}:${sheetName}:${range}`;
      const cached = readCache(cacheKey);
      if (cached) return cached;

      const url =
        `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq` +
        `?tqx=${encodeURIComponent("out:json")}` +
        `&sheet=${encodeURIComponent(sheetName)}` +
        `&range=${encodeURIComponent(range)}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Google Sheets returned HTTP ${response.status}.`);
      }

      const text = await response.text();
      const jsonText = text
        .replace(/^[\s\S]*?google\.visualization\.Query\.setResponse\(/, "")
        .replace(/\);\s*$/, "");
      const data = JSON.parse(jsonText);

      if (data.status === "error") {
        throw new Error(data.errors?.map((error) => error.detailed_message || error.message).join("; ") || "Google Sheets returned an error.");
      }

      writeCache(cacheKey, data);
      return data;
    }

    function readCache(key) {
      try {
        const cached = JSON.parse(localStorage.getItem(key) || "null");
        if (!cached || Date.now() - cached.cachedAt > CONFIG.cacheMs) return null;
        return cached.data;
      } catch {
        return null;
      }
    }

    function writeCache(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify({
          cachedAt: Date.now(),
          data
        }));
      } catch {
      }
    }

    function tableRows(data) {
      return (data.table?.rows || []).map((row) => (row.c || []).map((cell) => cell?.v ?? ""));
    }

    function getRedirectUrl(value) {
      const trimmed = String(value || "").trim();

      if (!trimmed || /\s/.test(trimmed) || /[<>]/.test(trimmed)) return "";
      if (/^(mailto|tel|sms):/i.test(trimmed)) return trimmed;
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      if (/^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return "";
      if (/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/.*)?$/i.test(trimmed)) {
        return `https://${trimmed}`;
      }
      return "";
    }

    function markdownToHtml(markdown) {
      const lines = String(markdown).replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let paragraph = [];
      let listOpen = "";
      let blockquote = [];
      let codeBlock = null;

      function getMarkdownTitle() {
        const firstContentLine = lines.find((line) => {
          const trimmed = line.trim();
          return trimmed && !/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed) && !trimmed.startsWith("```");
        });

        if (!firstContentLine) return "";

        return firstContentLine
          .trim()
          .replace(/^>\s?/, "")
          .replace(/^#{1,6}\s+/, "")
          .replace(/^[-*+]\s+/, "")
          .replace(/^\d+[.)]\s+/, "")
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, "$1")
          .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, "$1")
          .replace(/[*_`]/g, "")
          .replace(/\s*\|\s*/g, " ")
          .trim();
      }

      function renderInline(value) {
        return escapeHtml(value)
          .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<img src="$2" alt="$1">')
          .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<a href="$2">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/_([^_]+)_/g, "<em>$1</em>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function splitTableRow(line) {
        return line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());
      }

      function isTableSeparator(line) {
        return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
      }

      function isTableRow(line) {
        return line.trim().includes("|");
      }

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function closeList() {
        if (!listOpen) return;
        html.push(`</${listOpen}>`);
        listOpen = "";
      }

      function flushBlockquote() {
        if (!blockquote.length) return;
        flushParagraph();
        closeList();
        const quoteHtml = markdownToHtml(blockquote.join("\n"))
          .match(/<article class="preview-content">\s*([\s\S]*?)\s*<\/article>/)?.[1]
          .trim() || renderInline(blockquote.join(" "));
        html.push(`<blockquote>${quoteHtml}</blockquote>`);
        blockquote = [];
      }

      function renderTable(startIndex) {
        const headers = splitTableRow(lines[startIndex]);
        let rowIndex = startIndex + 2;
        const rows = [];

        while (rowIndex < lines.length && isTableRow(lines[rowIndex].trim()) && lines[rowIndex].trim()) {
          rows.push(splitTableRow(lines[rowIndex]));
          rowIndex += 1;
        }

        html.push("<table>");
        html.push("<thead>");
        html.push(`<tr>${headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr>`);
        html.push("</thead>");

        if (rows.length) {
          html.push("<tbody>");
          for (const row of rows) {
            html.push(`<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`);
          }
          html.push("</tbody>");
        }

        html.push("</table>");
        return rowIndex - 1;
      }

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const trimmed = line.trim();
        const fence = trimmed.match(/^```(?:\s*([a-z0-9-]+))?\s*$/i);

        if (fence) {
          if (codeBlock) {
            html.push(`<pre><code>${escapeHtml(codeBlock.lines.join("\n"))}</code></pre>`);
            codeBlock = null;
          } else {
            flushBlockquote();
            flushParagraph();
            closeList();
            codeBlock = { language: fence[1] || "", lines: [] };
          }
          continue;
        }

        if (codeBlock) {
          codeBlock.lines.push(line);
          continue;
        }

        if (!trimmed) {
          flushBlockquote();
          flushParagraph();
          closeList();
          continue;
        }

        const quote = trimmed.match(/^>\s?(.*)$/);
        if (quote) {
          blockquote.push(quote[1]);
          continue;
        }

        flushBlockquote();

        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html.push("<hr>");
          continue;
        }

        if (isTableRow(trimmed) && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
          flushParagraph();
          closeList();
          index = renderTable(index);
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
          continue;
        }

        const unorderedItem = trimmed.match(/^[-*+]\s+(.+)$/);
        if (unorderedItem) {
          flushParagraph();
          if (listOpen !== "ul") {
            closeList();
            html.push("<ul>");
            listOpen = "ul";
          }
          html.push(`<li>${renderInline(unorderedItem[1])}</li>`);
          continue;
        }

        const orderedItem = trimmed.match(/^\d+[.)]\s+(.+)$/);
        if (orderedItem) {
          flushParagraph();
          if (listOpen !== "ol") {
            closeList();
            html.push("<ol>");
            listOpen = "ol";
          }
          html.push(`<li>${renderInline(orderedItem[1])}</li>`);
          continue;
        }

        paragraph.push(trimmed);
      }

      if (codeBlock) html.push(`<pre><code>${escapeHtml(codeBlock.lines.join("\n"))}</code></pre>`);
      flushBlockquote();
      flushParagraph();
      closeList();

      const documentTitle = escapeHtml(getMarkdownTitle());

      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${documentTitle}</title>
  <style>

    }

      margin: 0 0 16px;
    }

      margin: 0 0 20px;
      padding-left: 1.5rem;
    }

    .preview-content a {
      color: var(--link-color);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.25em;
    }

    .preview-content blockquote {
      margin: 24px 0;
      padding: 0 0 0 16px;
      border-left: 3px solid var(--accent-border);
      color: #4b5563;
    }

    .preview-content code:not(pre code) {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
      background: var(--accent-soft);
      color: #111827;
      border-radius: 5px;
      padding: 0.2em 0.4em;
    }

    .preview-content pre {
      background: #f9fafb;
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      padding: 1.25rem;
      margin: 1.5rem 0;
      overflow-x: auto;
    }

    .preview-content pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
      font-size: 0.9em;
      line-height: 1.6;
    }

      display: block;
      max-width: 100%;
      height: auto;
      margin: 20px 0;
      border-radius: 8px;
    }

    .preview-content hr {
      border: 0;
      border-top: 1px solid var(--accent-border);
      margin: 36px 0;
    }

    .preview-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 15px;
    }

    .preview-content th,
    .preview-content td {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    .preview-content th {
      background: var(--accent-soft);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <article class="preview-content">
    ${html.join("\n    ")}
  </article>
</body>
</html>`;
    }

    function getRenderableHtml(value) {
      const trimmed = String(value || "").trim();
      const withoutCodeFence = trimmed
        .replace(/^```(?:html|markdown|md)?\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();

      if (CONFIG.allowRawHtml && (/^<!doctype html/i.test(withoutCodeFence) || /^<html[\s>]/i.test(withoutCodeFence))) {
        return withoutCodeFence;
      }

      if (CONFIG.allowRawHtml && /<(head|body|main|section|div|h1|p|style|script|img|a)[\s>]/i.test(withoutCodeFence)) {
        return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title></head><body>${withoutCodeFence}</body></html>`;
      }

      return markdownToHtml(withoutCodeFence);
    }

    }

    function renderClaimPage() {
      app.innerHTML = `
        <main class="claim-shell">
          <section class="claim-content">
            <a class="claim-brand" href="/"><span class="claim-dot"></span> built.at</a>
            <h1>Claim a name for your Sheet-powered site.</h1>

                  <input name="username" id="claim-username" autocomplete="username" inputmode="latin" maxlength="24" pattern="[A-Za-z0-9]{3,24}" placeholder="yourname" required>
                </div>

              </label>

              <label>
                Public Google Sheet URL
                <span>In Google Sheets, share it as anyone with the link can view, then paste that link here.</span>

              </label>

              <div class="claim-actions">
                <button type="submit" class="button" id="claim-submit" disabled>Claim name</button>
                <div class="claim-message" id="claim-message" aria-live="polite"></div>
              </div>
            </form>
          </section>
        </main>
      `;

      setupClaimForm();

    function setupClaimForm() {
      const form = document.getElementById("claim-form");
      const usernameInput = document.getElementById("claim-username");
      const sheetUrlInput = document.getElementById("claim-sheet-url");
      const availability = document.getElementById("claim-availability");
      const message = document.getElementById("claim-message");
      const submitButton = document.getElementById("claim-submit");
      let availabilityTimer = 0;
      let usernameAvailable = false;

      function normalizeUsername(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function setAvailability(text, state) {
        availability.textContent = text;
        availability.className = `claim-availability ${state || ""}`.trim();
      }

      function setMessage(text, state) {
        message.textContent = text;
        message.className = `claim-message ${state || ""}`.trim();
      }

      function updateSubmitState() {
        submitButton.disabled = !usernameAvailable || !sheetUrlInput.value.trim();
      }

      usernameInput.addEventListener("input", () => {
        const normalized = normalizeUsername(usernameInput.value);
        if (usernameInput.value !== normalized) usernameInput.value = normalized;

        usernameAvailable = false;
        updateSubmitState();
        window.clearTimeout(availabilityTimer);

        if (!normalized) {
          setAvailability("", "");
          return;
        }

        setAvailability("Checking...", "");
        availabilityTimer = window.setTimeout(async () => {
          try {
            const response = await fetch(`/api/check-username?username=${encodeURIComponent(normalized)}`);
            const result = await response.json();
            usernameAvailable = Boolean(result.available);
            setAvailability(result.message, result.available ? "ok" : "error");
          } catch {
            usernameAvailable = false;
            setAvailability("Could not check that name right now.", "error");
          }
          updateSubmitState();
        }, 300);
      });

      sheetUrlInput.addEventListener("input", updateSubmitState);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        setMessage("Saving...", "");

        try {
          const response = await fetch("/api/register", {
            method: "POST",
            headers: {
              "content-type": "application/json"
            },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const result = await response.json();

          if (!response.ok || !result.ok) {
            throw new Error(result.message || "Could not claim that name.");
          }

          setMessage(`Saved. Your site will be built.at/${result.username}.`, "success");
          form.reset();
          usernameAvailable = false;
          setAvailability("", "");
        } catch (error) {
          setMessage(error.message || String(error), "error");
        }

        updateSubmitState();
      });
    }

    async function renderUserPage(username, slug) {
      if (!CONFIG.masterSheetId) {
        showStatus(
          "This built.at site is almost ready",
          "The page you opened is not connected to a published site yet. The built.at homepage is available at <a href=\"/\">built-at-sheets.pages.dev</a>.",
          ""
        );
        return;
      }

      try {
        const registryData = await loadGviz(CONFIG.masterSheetId, CONFIG.masterSheetName, CONFIG.masterRange);
        const rawRegistryRows = tableRows(registryData);
        const headerRow = rawRegistryRows.find((row) => isHeaderRow(row, ["username", "pasted_sheet_url", "sheet_id"])) || [];
        const hiddenColumn = headerRow.findIndex((cell) => String(cell || "").trim().toLowerCase() === "hidden");
        const activeColumn = headerRow.findIndex((cell) => String(cell || "").trim().toLowerCase() === "active");
        const registryRows = rawRegistryRows.filter((row) => {
          return !isHeaderRow(row, ["username", "pasted_sheet_url", "sheet_id"]);
        });
        const match = registryRows.find((row) => String(row[0] || "").trim().toLowerCase() === username.toLowerCase());

        if (!match) {
          showStatus("Site not found", `No active built.at site was found for <code>${escapeHtml(username)}</code>.`);
          return;
        }

        const isHidden = hiddenColumn >= 0 && booleanCell(match[hiddenColumn]);
        const isInactive = activeColumn >= 0 && !booleanCell(match[activeColumn]);
        if (isHidden || isInactive) {
          showStatus("Site not available", `This built.at site is not currently public.`);
          return;
        }

        const userSheetId = extractSheetId(match[2]) || extractSheetId(match[1]);
        if (!userSheetId) {
          showStatus("User Sheet is missing", `The registry row for <code>${escapeHtml(username)}</code> does not include a valid Google Sheet URL or Sheet ID.`);
          return;
        }

        const contentData = await loadGviz(userSheetId, CONFIG.userSheetName, CONFIG.userRange);
        const contentRows = tableRows(contentData).filter((row) => {
          return !isHeaderRow(row, ["content", "slug"]);
        });
        const page = contentRows.find((row) => normalizeSlug(row[1]) === slug);

        if (!page) {
          showStatus("Page not found", `The site exists, but there is no row with slug <code>${escapeHtml(slug)}</code>.`);
          return;
        }

        const content = String(page[0] || "");
        if (!content.trim()) {
          showStatus("Page is empty", `The row for <code>${escapeHtml(slug)}</code> has no content in column A.`);
          return;
        }

        const redirectUrl = getRedirectUrl(content);
        if (redirectUrl) {
          window.location.replace(redirectUrl);
          return;
        }

        const rendered = getRenderableHtml(content);
        document.open();
        document.write(rendered);
        document.close();
      } catch (error) {
        showStatus(
          "Could not load the Sheet site",
          "Check that the master Sheet and user Sheet are shared with <code>Anyone with the link can view</code>.",
          String(error)
        );
      }
    }

    const route = getRoute();
    if (!route.username) {
      renderMarketingPage();
    } else if (isAppRoute(route, "claim")) {
      renderClaimPage();
    } else {
      renderUserPage(route.username, route.slug);
    }
  </script>
